[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-temp-email"
version = "0.1.0"
description = "Python client for Temp Email API on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "temp", "email"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/temp-email"
Source = "https://github.com/apivault-labs/temp-email-python"
Documentation = "https://github.com/apivault-labs/temp-email-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_temp_email*"]
